name: Feature request
description: Propose a concrete user-facing improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this, and what cannot they do today?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Proposed workflow
      description: Show the desired CLI or Python API experience.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Real-world evidence
      description: Link public repositories or workflows that demonstrate the need.
    validations:
      required: false
  - type: textarea
    id: cost
    attributes:
      label: Operational and security cost
      description: Address runtime dependencies, network use, cache growth, and trust-boundary changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
