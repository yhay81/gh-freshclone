name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run bandit -r gh_freshclone scripts/github_action.py -q
      - run: uv run coverage run -m pytest -q
      - run: uv run coverage report
      - run: uv build

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_FRESHCLONE_E2E_RUNNER: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: docker info
      - run: uv run pytest -q tests/test_container_e2e.py
      - name: Exercise the local composite action
        id: action-e2e
        uses: ./
        with:
          repository: "."
          no-cache: "true"
      - name: Verify the composite-action result
        env:
          RESULT_PATH: ${{ steps.action-e2e.outputs.result-path }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          result_path = Path(os.environ["RESULT_PATH"])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          expected_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          assert result["status"] == "pass"
          assert result["cached"] is False
          assert result["receipt_version"] == 7
          assert result["execution_policy_version"] == 22
          assert result["plan"]["plan_version"] == 10
          assert result["plan"]["repository"]["commit_sha"] == expected_commit
          PY

  docker-arm64-cmake-make-e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GH_FRESHCLONE_E2E_RUNNER: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Verify native arm64 Docker boundary
        run: |
          test "$(uname -m)" = "aarch64"
          docker info
      - run: uv sync --locked
      - name: Exercise CMake and Make offline tests on arm64
        run: uv run pytest -q tests/test_container_e2e.py -k "cmake or make_baseline"

  docker-arm64-dotnet-e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GH_FRESHCLONE_E2E_RUNNER: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Verify native arm64 Docker boundary
        run: |
          test "$(uname -m)" = "aarch64"
          docker info
      - run: uv sync --locked
      - name: Exercise .NET restore and offline test on arm64
        run: uv run pytest -q tests/test_container_e2e.py -k dotnet

  docker-arm64-php-e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GH_FRESHCLONE_E2E_RUNNER: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Verify native arm64 Docker boundary
        run: |
          test "$(uname -m)" = "aarch64"
          docker info
      - run: uv sync --locked
      - name: Exercise Composer prepare and offline PHPUnit on arm64
        run: uv run pytest -q tests/test_container_e2e.py -k composer

  docker-arm64-ruby-e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GH_FRESHCLONE_E2E_RUNNER: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Verify native arm64 Docker boundary
        run: |
          test "$(uname -m)" = "aarch64"
          docker info
      - run: uv sync --locked
      - name: Exercise checksummed RubyGems and offline Bundler on arm64
        run: uv run pytest -q tests/test_container_e2e.py -k bundler

  performance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Enforce clone-free PASS p95
        run: >-
          uv run python -m benchmarks.cached_workflow .
          --runner docker --iterations 30 --max-p95-ms 250
      - name: Enforce installed CLI startup p95
        run: uv run python -m benchmarks.cli_startup --max-p95-ms 250
