name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'yhay81/gh-freshclone'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Verify tag and project version
        shell: bash
        run: |
          package_version="$(uv version --short)"
          test "v${package_version}" = "${RELEASE_TAG}"
          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"
      - name: Verify source
        run: |
          uv sync --locked
          uv run ruff check .
          uv run pyright
          uv run bandit -r gh_freshclone scripts/github_action.py -q
          uv run coverage run -m pytest -q
          uv run coverage report
          docker info
          GH_FRESHCLONE_E2E_RUNNER=docker \
            uv run pytest -q tests/test_container_e2e.py
          uv run python -m benchmarks.cached_workflow . \
            --runner docker --iterations 30 --max-p95-ms 250
          uv run python -m benchmarks.cli_startup --max-p95-ms 250
          uv run python -m benchmarks.public_plan_cohort
      - name: Build distributions without workspace sources
        run: uv build --no-sources
      - name: Smoke-test wheel and source distribution
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "${artifact}" \
              python -I scripts/smoke_dist.py "${PACKAGE_VERSION}"
          done
      - name: Record distribution checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - name: Transfer verified release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.repository == 'yhay81/gh-freshclone'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/gh-freshclone
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Verify transferred checksums and artifact set
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*)
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#files[@]}" -eq 3
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Attest release distributions
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Create or refresh draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --draft --generate-notes --verify-tag \
              --title "gh-freshclone ${RELEASE_TAG}"
          fi
      - name: Prepare the PyPI-only distribution set
        if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
        shell: bash
        run: |
          mkdir pypi-dist
          cp -- dist/*.whl dist/*.tar.gz pypi-dist/
      - name: Publish to PyPI with Trusted Publishing
        if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: pypi-dist/
          attestations: true
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${RELEASE_TAG}" --draft=false
