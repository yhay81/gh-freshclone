name: Public plan cohort

on:
  workflow_dispatch:
  schedule:
    - cron: "13 18 * * 4"

permissions:
  contents: read

concurrency:
  group: public-plan-cohort
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Reproduce manifest-only planning
        run: >-
          uv run python -m benchmarks.public_plan_cohort
          --output public-plan-cohort-result.json
      - name: Retain the complete cohort result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-plan-cohort-result
          path: public-plan-cohort-result.json
          if-no-files-found: error
          retention-days: 30
