name: Public plan cohort

on:
  workflow_dispatch:
  schedule:
    - cron: "13 18 * * 4"

permissions:
  contents: read

concurrency:
  group: public-plan-cohort
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Reproduce manifest-only planning
        run: >-
          uv run python -m benchmarks.public_plan_cohort
          --output public-plan-cohort-result.json
      - name: Retain the complete cohort result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-plan-cohort-result
          path: public-plan-cohort-result.json
          if-no-files-found: error
          retention-days: 30
