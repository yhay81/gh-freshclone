[project]
name = "gh-freshclone"
version = "0.15.0"
description = "Compile and prove the fastest trustworthy baseline for a GitHub repository."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "yhay81" }]
keywords = ["github", "testing", "containers", "open-source", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
gh-freshclone = "gh_freshclone.entry:main"

[project.urls]
Repository = "https://github.com/yhay81/gh-freshclone"
Issues = "https://github.com/yhay81/gh-freshclone/issues"

[dependency-groups]
dev = [
  "bandit>=1.8",
  "coverage>=7.10",
  "jsonschema>=4.23",
  "pyright>=1.1.400",
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gh_freshclone"]

[tool.hatch.build.targets.wheel.force-include]
"gh_freshclone/schemas/receipt-v6.schema.json" = "gh_freshclone/schemas/receipt-v6.schema.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["gh_freshclone"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["gh_freshclone"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--basetemp=.pytest-tmp", "-p", "no:cacheprovider"]
